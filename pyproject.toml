[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-rotation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "quant-data",  # install: pip install -e ../quant-data
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["etf_rotation*"]
